<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2146" />
    <meta name="description" content="Important IIITDM Jabalpur campus announcements." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/dock.css" />
    <link rel="stylesheet" href="css/announcements.css" />
    <title>Announcements | Campus Companion</title>
  </head>
  <body class="announcements-page">
    <div class="app-layout">
      
      <!-- Persistent Desktop Sidebar -->
      <aside class="portal-sidebar" aria-label="Portal Navigation">
        <div class="sidebar-top-section">
          <a class="sidebar-brand-link" href="dashboard.html" title="IIITDM Jabalpur Campus Companion">
            <img src="assets/iiitdm-logo.png" alt="PDPM IIITDM Jabalpur Logo" class="sidebar-logo-img" />
          </a>

          <nav class="sidebar-nav" aria-label="Main menu">
            <a class="sidebar-nav-item" href="dashboard.html" data-nav="dashboard">
              <span class="sidebar-nav-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                <span>Dashboard</span>
              </span>
            </a>

            <a class="sidebar-nav-item" href="schedule.html" data-nav="schedule">
              <span class="sidebar-nav-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2.2"/>
                  <line x1="16" y1="2" x2="16" y2="6" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="8" y1="2" x2="8" y2="6" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/>
                </svg>
                <span>My Schedule</span>
              </span>
              <span class="sidebar-badge sidebar-calendar-date">26</span>
            </a>

            <a class="sidebar-nav-item active" href="announcements.html" data-nav="announcements">
              <span class="sidebar-nav-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span>Announcements</span>
              </span>
              <span class="sidebar-dot"></span>
            </a>

            <a class="sidebar-nav-item" href="profile.html" data-nav="profile">
              <span class="sidebar-nav-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span>My Profile</span>
              </span>
            </a>
          </nav>

          <div class="sidebar-quick-links">
            <p class="sidebar-section-label">Campus Links</p>
            <a class="sidebar-link" href="https://www.iiitdmj.ac.in" target="_blank" rel="noreferrer">🏛️ IIITDM Portal</a>
            <a class="sidebar-link" href="schedule.html">📅 Timetable</a>
            <a class="sidebar-link" href="announcements.html">📢 Notices</a>
          </div>
        </div>

        <div class="sidebar-user-footer">
          <a class="sidebar-user-info" href="profile.html" title="View Profile">
            <div class="sidebar-avatar" id="sidebarUserAvatar">👤</div>
            <div class="sidebar-user-text">
              <div class="sidebar-user-name" id="sidebarUserName">Student</div>
              <div class="sidebar-user-sub" id="sidebarUserSub">IIITDM Jabalpur</div>
            </div>
          </a>
          <button class="sidebar-logout-btn" id="sidebarLogoutBtn" type="button" title="Sign out" onclick="window.CampusAuth?.signOut()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Main Portal Wrapper -->
      <div class="portal-main-wrapper">
        <header class="portal-top-header">
          <div class="portal-search-bar">
            <svg class="portal-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input class="portal-search-input" type="text" placeholder="Search classes, rooms, announcements... (⌘K)" aria-label="Search" />
          </div>

          <div class="portal-header-meta">
            <span class="portal-today-date" id="portalHeaderDate">Tuesday, October 26, 2026</span>
            <a class="portal-header-icon-btn" id="notificationButton" href="announcements.html" title="Announcements" aria-label="Announcements">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <span class="portal-unread-badge"></span>
            </a>
            <a class="portal-header-icon-btn" href="profile.html" title="Profile" aria-label="Profile">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </a>
          </div>
        </header>

        <main class="announcements-main">
          <section class="announcements-title" aria-labelledby="pageHeading">
            <h1 id="pageHeading">Announcements</h1>
            <button class="add-content-button" id="addAnnouncementButton" type="button" hidden>
              + Add Announcement
            </button>
          </section>

          <section class="filter-section" aria-label="Filter announcements">
            <div class="filter-buttons" id="filterButtons">
              <button class="filter-button active" type="button" data-filter="All" aria-pressed="true">
                All
              </button>
              <button class="filter-button" type="button" data-filter="Academic" aria-pressed="false">
                Academic
              </button>
              <button class="filter-button" type="button" data-filter="Events" aria-pressed="false">
                Events
              </button>
              <button class="filter-button" type="button" data-filter="Urgent" aria-pressed="false">
                Urgent
              </button>
            </div>
          </section>

          <section class="announcements-list" id="announcementsList" aria-live="polite">
            <p class="announcement-state">Loading announcements...</p>
          </section>

          <p class="reminder-page-status" id="reminderPageStatus" aria-live="polite"></p>
          <p class="management-status" id="announcementManagementStatus" aria-live="polite"></p>
        </main>

        <footer class="announcements-footer">IIITDM Jabalpur Campus Companion</footer>
      </div>

    </div>

    <!-- Announcement Management Modal -->
    <div class="management-modal" id="announcementModal" hidden>
      <section class="management-dialog" role="dialog" aria-modal="true" aria-labelledby="announcementFormTitle">
        <div class="dialog-heading">
          <h2 id="announcementFormTitle">Add Announcement</h2>
          <button class="dialog-close" id="closeAnnouncementForm" type="button" aria-label="Close">×</button>
        </div>

        <form id="announcementForm">
          <input id="announcementId" type="hidden" />

          <div class="management-field">
            <label for="announcementTitle">Title</label>
            <input id="announcementTitle" type="text" required />
          </div>
          <div class="management-field">
            <label for="announcementDescription">Description</label>
            <textarea id="announcementDescription" rows="4" required></textarea>
          </div>
          <div class="management-field">
            <label for="announcementCategory">Category</label>
            <select id="announcementCategory" required>
              <option value="" selected disabled>Select category</option>
              <option value="Academic">Academic</option>
              <option value="Events">Events</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>

          <div class="management-row">
            <div class="management-field">
              <label for="announcementSemester">Target Semester</label>
              <select id="announcementSemester" required>
                <option value="" selected disabled>Select semester</option>
                <option value="ALL">ALL (All Semesters)</option>
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
                <option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option>
              </select>
            </div>
            <div class="management-field">
              <label for="announcementBranch">Target Branch</label>
              <select id="announcementBranch" class="branch-select" required>
                <option value="" disabled>Select branch</option>
                <option value="ALL" selected>ALL (All Branches)</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="ME">ME</option>
                <option value="SM">SM</option>
              </select>
            </div>
            <div class="management-field">
              <label for="announcementSection">Target Section</label>
              <select id="announcementSection" required>
                <option value="ALL">ALL</option>
              </select>
            </div>
          </div>

          <div class="management-field">
            <label for="announcementDeadline">Optional Deadline</label>
            <input id="announcementDeadline" type="datetime-local" />
          </div>
          <div class="management-field">
            <label for="announcementButtonText">Button Text</label>
            <input id="announcementButtonText" type="text" />
          </div>
          <div class="management-field">
            <label for="announcementActionUrl">Optional Action URL</label>
            <input id="announcementActionUrl" type="url" placeholder="https://example.com" />
          </div>

          <div class="management-form-actions">
            <button class="save-button" type="submit">Save</button>
            <button class="cancel-button" id="cancelAnnouncementForm" type="button">Cancel</button>
          </div>
        </form>
      </section>
    </div>

    <!-- Mobile Slideable Dock -->
    <div class="mobile-dock-wrapper" aria-label="Mobile Navigation Dock">
      <nav class="mobile-dock" aria-label="Mobile Navigation">
        <a class="dock-tab" href="dashboard.html" data-nav="dashboard" title="Dashboard">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span class="dock-label">Home</span>
        </a>

        <a class="dock-tab" href="schedule.html" data-nav="schedule" title="My Schedule">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="3" stroke-width="2.2"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/>
          </svg>
          <span class="dock-calendar-date">26</span>
          <span class="dock-label">Schedule</span>
        </a>

        <a class="dock-tab active" href="announcements.html" data-nav="announcements" title="Announcements">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="dock-alert-dot"></span>
          <span class="dock-label">Alerts</span>
        </a>

        <a class="dock-tab" href="profile.html" data-nav="profile" title="Profile">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="dock-label">Profile</span>
        </a>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/announcements.js" defer></script>
    <script src="js/dock.js" defer></script>
  </body>
</html>
